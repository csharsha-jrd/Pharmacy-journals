<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pharmacy Journal Hidden Gems</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f7f8fa;
      color: #1a1a2e;
      font-size: 14px;
      line-height: 1.5;
    }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ───────────────────────────────────────────────────────── */
    header {
      background: #1a1a2e;
      color: #fff;
      padding: 22px 32px 18px;
    }
    header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: .3px; }
    header p  { font-size: .8rem; opacity: .7; margin-top: 4px; }
    #meta-bar {
      font-size: .75rem;
      opacity: .6;
      margin-top: 6px;
    }

    main { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }

    /* ── Controls ─────────────────────────────────────────────────────── */
    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 18px;
    }
    #search-box {
      flex: 1 1 220px;
      padding: 7px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }
    #search-box:focus { border-color: #2563eb; box-shadow: 0 0 0 2px #dbeafe; }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .filter-group label { color: #6b7280; font-weight: 600; }
    .filter-group select, .filter-group input[type=checkbox] { cursor: pointer; }
    select {
      border: none;
      background: transparent;
      font-size: 12px;
      outline: none;
      padding: 0;
    }

    #result-count {
      margin-left: auto;
      font-size: 12px;
      color: #6b7280;
      white-space: nowrap;
    }

    /* ── Table ────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
    }
    thead th {
      position: sticky;
      top: 0;
      background: #f1f5f9;
      padding: 10px 12px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: #374151;
      border-bottom: 2px solid #e5e7eb;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    thead th:hover { background: #e2e8f0; }
    thead th .sort-icon { opacity: .4; margin-left: 4px; font-size: 10px; }
    thead th.sorted-asc .sort-icon::after  { content: " ▲"; opacity: 1; }
    thead th.sorted-desc .sort-icon::after { content: " ▼"; opacity: 1; }

    tbody tr {
      border-bottom: 1px solid #f3f4f6;
      transition: background .12s;
    }
    tbody tr:hover { background: #f0f7ff; cursor: pointer; }
    tbody tr.expanded { background: #eff6ff; }
    td { padding: 9px 12px; vertical-align: top; }

    /* ── Gem score badge ──────────────────────────────────────────────── */
    .score-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-weight: 700;
      font-size: 13px;
      color: #fff;
    }
    .score-10 { background: #15803d; }
    .score-7  { background: #2563eb; }
    .score-5  { background: #7c3aed; }
    .score-3  { background: #b45309; }
    .score-lo { background: #9ca3af; }

    /* ── Boolean chips ────────────────────────────────────────────────── */
    .chip {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .chip-yes  { background: #dcfce7; color: #166534; }
    .chip-no   { background: #f3f4f6; color: #6b7280; }
    .chip-free { background: #d1fae5; color: #065f46; font-weight: 700; }
    .chip-low  { background: #fef9c3; color: #713f12; }
    .chip-paid { background: #fee2e2; color: #991b1b; }
    .chip-unk  { background: #f3f4f6; color: #9ca3af; }

    .q1 { background: #4f46e5; color: #fff; }
    .q2 { background: #0ea5e9; color: #fff; }
    .q3 { background: #f59e0b; color: #fff; }
    .q4 { background: #ef4444; color: #fff; }

    /* ── Expanded detail row ──────────────────────────────────────────── */
    tr.detail-row td {
      padding: 0;
      background: #f8faff;
      border-bottom: 2px solid #bfdbfe;
    }
    .detail-panel {
      padding: 14px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 12px 24px;
      font-size: 12px;
    }
    .detail-panel .field label { color: #6b7280; font-weight: 700; display: block; margin-bottom: 2px; }
    .detail-panel .field span  { color: #111; }
    .breakdown-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .breakdown-item {
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 4px;
      padding: 2px 7px;
      font-size: 11px;
      font-weight: 600;
    }
    .breakdown-item.neg { background: #fee2e2; color: #991b1b; }

    /* ── Empty state ──────────────────────────────────────────────────── */
    #empty {
      text-align: center;
      padding: 60px 20px;
      color: #9ca3af;
      display: none;
    }

    /* ── Download bar ─────────────────────────────────────────────────── */
    #downloads {
      margin-top: 18px;
      font-size: 12px;
      color: #6b7280;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    #downloads a {
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 5px;
      padding: 4px 12px;
      color: #374151;
      font-weight: 600;
    }
    #downloads a:hover { background: #f1f5f9; text-decoration: none; }

    @media (max-width: 640px) {
      header { padding: 16px; }
      main { padding: 14px 10px; }
    }
  </style>
</head>
<body>

<header>
  <h1>Pharmacy Journal Hidden Gems</h1>
  <p>Scopus / WoS indexed — Low or No APC — Open Access</p>
  <div id="meta-bar">Loading data&hellip;</div>
</header>

<main>
  <div id="controls">
    <input id="search-box" type="search" placeholder="Search by title, publisher, country…" />

    <div class="filter-group">
      <label>Scopus</label>
      <select id="f-scopus">
        <option value="">Any</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div class="filter-group">
      <label>WoS</label>
      <select id="f-wos">
        <option value="">Any</option>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>
    </div>

    <div class="filter-group">
      <label>APC</label>
      <select id="f-apc">
        <option value="">Any</option>
        <option value="free">Free</option>
        <option value="low">Low (≤ $500)</option>
        <option value="paid">Paid</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Quartile</label>
      <select id="f-quartile">
        <option value="">Any</option>
        <option value="Q1">Q1</option>
        <option value="Q2">Q2</option>
        <option value="Q3">Q3</option>
        <option value="Q4">Q4</option>
      </select>
    </div>

    <span id="result-count"></span>
  </div>

  <div class="table-wrap">
    <table id="gem-table">
      <thead>
        <tr>
          <th data-col="gem_score">Score<span class="sort-icon"></span></th>
          <th data-col="title">Journal Title<span class="sort-icon"></span></th>
          <th data-col="publisher">Publisher<span class="sort-icon"></span></th>
          <th data-col="country">Country<span class="sort-icon"></span></th>
          <th data-col="scopus_indexed">Scopus<span class="sort-icon"></span></th>
          <th data-col="wos_indexed">WoS<span class="sort-icon"></span></th>
          <th data-col="sjr_quartile">Quartile<span class="sort-icon"></span></th>
          <th data-col="_apc_display">APC<span class="sort-icon"></span></th>
          <th data-col="acceptance_rate_pct">Accept. Rate<span class="sort-icon"></span></th>
          <th data-col="cited_by_count">Citations<span class="sort-icon"></span></th>
        </tr>
      </thead>
      <tbody id="gem-tbody"></tbody>
    </table>
    <div id="empty">No journals match your filters.</div>
  </div>

  <div id="downloads">
    Download:
    <a href="data/pharmacy_journals_hidden_gems.json" download>JSON</a>
    <a href="data/pharmacy_journals_hidden_gems.csv"  download>CSV</a>
    <a href="data/pharmacy_journals.json" download>Full dataset (JSON)</a>
    <a href="data/pharmacy_journals.csv"  download>Full dataset (CSV)</a>
  </div>
</main>

<script>
/* ============================================================
   Data loading
   ============================================================ */
let allData = [];
let sortCol = 'gem_score';
let sortAsc  = false;
let expandedRow = null;

async function loadData() {
  try {
    const [gemsRes, metaRes] = await Promise.allSettled([
      fetch('data/pharmacy_journals_hidden_gems.json'),
      fetch('data/meta.json'),
    ]);

    if (gemsRes.status === 'fulfilled' && gemsRes.value.ok) {
      allData = await gemsRes.value.json();
    } else {
      // Fallback: show a placeholder row so the page renders
      allData = [];
    }

    if (metaRes.status === 'fulfilled' && metaRes.value.ok) {
      const meta = await metaRes.value.json();
      const d = new Date(meta.built_at);
      const fmt = d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
      document.getElementById('meta-bar').innerHTML =
        `Last updated: ${fmt} &nbsp;·&nbsp; <a href="${meta.run_url}" target="_blank" style="color:#93c5fd">Build log</a>`;
    } else {
      document.getElementById('meta-bar').textContent = '';
    }

    // Pre-compute APC display & numeric for filtering/sorting
    allData.forEach(r => {
      r._apc_usd = parseApcUsd(r);
      r._apc_display = apcLabel(r);
    });

    render();
  } catch (e) {
    document.getElementById('meta-bar').textContent = 'Error loading data.';
    console.error(e);
  }
}

/* ============================================================
   APC helpers
   ============================================================ */
function parseApcUsd(r) {
  if (typeof r.oa_apc_usd === 'number') return r.oa_apc_usd;
  if (r.apc_has === false) return 0;
  const s = (r.scraped_apc || '');
  const m = s.match(/(?:USD|US\$|\$)\s?([\d,]+)/i);
  if (m) return parseFloat(m[1].replace(/,/g,''));
  return null;
}

function apcLabel(r) {
  const u = r._apc_usd;
  if (r.apc_has === false || u === 0) return 'FREE';
  if (u !== null && u <= 500) return `Low ($${u.toLocaleString()})`;
  if (u !== null) return `$${u.toLocaleString()}`;
  return r.scraped_apc || 'Unknown';
}

function apcChip(r) {
  const u = r._apc_usd;
  if (r.apc_has === false || u === 0) return '<span class="chip chip-free">FREE</span>';
  if (u !== null && u <= 500) return `<span class="chip chip-low">Low $${u.toLocaleString()}</span>`;
  if (u !== null) return `<span class="chip chip-paid">$${u.toLocaleString()}</span>`;
  if (r.scraped_apc) return `<span class="chip chip-paid">${r.scraped_apc}</span>`;
  return '<span class="chip chip-unk">Unknown</span>';
}

/* ============================================================
   Filtering
   ============================================================ */
function filterData() {
  const q       = document.getElementById('search-box').value.trim().toLowerCase();
  const scopus  = document.getElementById('f-scopus').value;
  const wos     = document.getElementById('f-wos').value;
  const apc     = document.getElementById('f-apc').value;
  const quartile= document.getElementById('f-quartile').value;

  return allData.filter(r => {
    if (q && !`${r.title} ${r.publisher} ${r.country} ${r.subjects}`.toLowerCase().includes(q)) return false;
    if (scopus === 'yes' && !r.scopus_indexed) return false;
    if (scopus === 'no'  && r.scopus_indexed)  return false;
    if (wos === 'yes' && !r.wos_indexed) return false;
    if (wos === 'no'  && r.wos_indexed)  return false;
    if (quartile && r.sjr_quartile !== quartile) return false;
    if (apc === 'free' && !(r.apc_has === false || r._apc_usd === 0)) return false;
    if (apc === 'low'  && !(r._apc_usd !== null && r._apc_usd > 0 && r._apc_usd <= 500)) return false;
    if (apc === 'paid' && !(r._apc_usd !== null && r._apc_usd > 500)) return false;
    return true;
  });
}

/* ============================================================
   Sorting
   ============================================================ */
function sortData(rows) {
  const col = sortCol;
  return [...rows].sort((a, b) => {
    let av = a[col], bv = b[col];
    if (av == null) av = sortAsc ? Infinity : -Infinity;
    if (bv == null) bv = sortAsc ? Infinity : -Infinity;
    if (typeof av === 'string') av = av.toLowerCase();
    if (typeof bv === 'string') bv = bv.toLowerCase();
    if (av < bv) return sortAsc ? -1 :  1;
    if (av > bv) return sortAsc ?  1 : -1;
    return 0;
  });
}

/* ============================================================
   Rendering
   ============================================================ */
function scoreBadge(s) {
  const cls = s >= 10 ? 'score-10' : s >= 7 ? 'score-7' : s >= 5 ? 'score-5' : s >= 3 ? 'score-3' : 'score-lo';
  return `<span class="score-badge ${cls}">${s}</span>`;
}

function boolChip(val, labelYes = 'Yes', labelNo = 'No') {
  return val
    ? `<span class="chip chip-yes">${labelYes}</span>`
    : `<span class="chip chip-no">${labelNo}</span>`;
}

function quartileChip(q) {
  if (!q) return '<span class="chip chip-unk">—</span>';
  return `<span class="chip ${q.toLowerCase()}">${q}</span>`;
}

function breakdownHtml(breakdown) {
  try {
    const bd = typeof breakdown === 'string' ? JSON.parse(breakdown) : (breakdown || {});
    return Object.entries(bd).map(([k, v]) => {
      const cls = v < 0 ? 'neg' : '';
      const label = k.replace(/_/g, ' ');
      return `<span class="breakdown-item ${cls}">${label}: ${v > 0 ? '+' : ''}${v}</span>`;
    }).join('');
  } catch { return '—'; }
}

function renderDetailRow(r) {
  const wosCol = Array.isArray(r.wos_collections)
    ? r.wos_collections.join(', ')
    : (r.wos_collections || '—');

  return `<tr class="detail-row"><td colspan="10">
    <div class="detail-panel">
      <div class="field"><label>ISSN(s)</label><span>${Array.isArray(r.issns) ? r.issns.join(', ') : (r.issns || '—')}</span></div>
      <div class="field"><label>Subjects</label><span>${r.subjects || '—'}</span></div>
      <div class="field"><label>Peer Review</label><span>${r.peer_review || '—'}</span></div>
      <div class="field"><label>WoS Collections</label><span>${wosCol}</span></div>
      <div class="field"><label>h-Index (Scimago)</label><span>${r.h_index ?? '—'}</span></div>
      <div class="field"><label>SJR</label><span>${r.sjr ?? '—'}</span></div>
      <div class="field"><label>Works in OpenAlex</label><span>${r.works_count != null ? r.works_count.toLocaleString() : '—'}</span></div>
      <div class="field"><label>Waiver Available</label><span>${r.waiver_has ? 'Yes' : (r.waiver_has === false ? 'No' : '—')}</span></div>
      <div class="field" style="grid-column:1/-1"><label>Scope</label><span>${r.scraped_scope || r.scope_seed || '—'}</span></div>
      <div class="field" style="grid-column:1/-1">
        <label>Score Breakdown</label>
        <div class="breakdown-list">${breakdownHtml(r.gem_breakdown)}</div>
      </div>
      ${r.homepage ? `<div class="field" style="grid-column:1/-1"><label>Homepage</label><span><a href="${r.homepage}" target="_blank" rel="noopener">${r.homepage}</a></span></div>` : ''}
    </div>
  </td></tr>`;
}

function render() {
  const filtered = filterData();
  const sorted   = sortData(filtered);

  document.getElementById('result-count').textContent =
    `${sorted.length} of ${allData.length} journals`;

  const tbody = document.getElementById('gem-tbody');
  tbody.innerHTML = '';
  document.getElementById('empty').style.display = sorted.length ? 'none' : 'block';

  sorted.forEach((r, idx) => {
    const ar = r.acceptance_rate_pct != null ? `${r.acceptance_rate_pct}%` : '—';
    const cit = r.cited_by_count != null ? r.cited_by_count.toLocaleString() : '—';

    const tr = document.createElement('tr');
    tr.dataset.idx = idx;
    tr.innerHTML = `
      <td>${scoreBadge(r.gem_score)}</td>
      <td><strong>${r.title || '—'}</strong></td>
      <td>${r.publisher || '—'}</td>
      <td>${r.country || '—'}</td>
      <td>${boolChip(r.scopus_indexed)}</td>
      <td>${boolChip(r.wos_indexed)}</td>
      <td>${quartileChip(r.sjr_quartile)}</td>
      <td>${apcChip(r)}</td>
      <td>${ar}</td>
      <td>${cit}</td>
    `;

    tr.addEventListener('click', () => toggleDetail(tr, r));
    tbody.appendChild(tr);
  });

  // Update sort header indicators
  document.querySelectorAll('thead th').forEach(th => {
    th.classList.remove('sorted-asc', 'sorted-desc');
    if (th.dataset.col === sortCol) {
      th.classList.add(sortAsc ? 'sorted-asc' : 'sorted-desc');
    }
  });
}

function toggleDetail(tr, r) {
  // If there's already an expanded row, remove it
  if (expandedRow && expandedRow !== tr) {
    const prev = document.querySelector('tr.detail-row');
    if (prev) prev.remove();
    if (expandedRow) expandedRow.classList.remove('expanded');
  }

  if (tr.classList.contains('expanded')) {
    // Collapse
    const det = tr.nextElementSibling;
    if (det && det.classList.contains('detail-row')) det.remove();
    tr.classList.remove('expanded');
    expandedRow = null;
  } else {
    // Expand
    tr.classList.add('expanded');
    tr.insertAdjacentHTML('afterend', renderDetailRow(r));
    expandedRow = tr;
  }
}

/* ============================================================
   Event wiring
   ============================================================ */
document.getElementById('search-box').addEventListener('input', render);
['f-scopus','f-wos','f-apc','f-quartile'].forEach(id => {
  document.getElementById(id).addEventListener('change', render);
});

document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = col === 'title';   // strings default ascending, numbers descending
    }
    // Collapse any open detail row when re-sorting
    const det = document.querySelector('tr.detail-row');
    if (det) det.remove();
    if (expandedRow) expandedRow.classList.remove('expanded');
    expandedRow = null;
    render();
  });
});

loadData();
</script>
</body>
</html>
